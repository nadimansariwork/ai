<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect With Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-cream: linear-gradient(135deg, #fdfbf7 0%, #f5ebd6 50%, #ead5a8 100%);
            --card-surface: rgba(255, 253, 249, 0.85);
            --gold-border: rgba(180, 134, 42, 0.28);
            --gold-accent: #b4862a;
            --gold-gradient: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            --text-dark: #2c2214;
            --text-muted: #78664e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(75px);
            z-index: 0;
            animation: float 8s infinite ease-in-out alternate;
        }
        .orb-1 { width: 320px; height: 320px; background: radial-gradient(circle, #f3d078, #e5b84b); top: -60px; left: -60px; opacity: 0.45; }
        .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, #fceabb, #f8b500); bottom: -60px; right: -60px; opacity: 0.4; animation-delay: -4s; }
        @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(25px) scale(1.08); } }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: var(--card-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1.5px solid var(--gold-border);
            border-radius: 32px;
            padding: 36px 24px;
            box-shadow: 0 25px 50px -12px rgba(138, 102, 28, 0.22),
                        inset 0 2px 2px rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        .brand-badge {
            width: 84px;
            height: 84px;
            margin: 0 auto 16px;
            border-radius: 24px;
            background: var(--gold-gradient);
            border: 2px solid #fff8e7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(180, 134, 42, 0.3), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: transform 0.3s ease;
        }
        .brand-badge img { width: 100%; height: 100%; object-fit: cover; }
        .container:hover .brand-badge { transform: scale(1.05); }
        h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; color: var(--text-dark); }
        p.subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 30px; }

        .links-wrapper { display: flex; flex-direction: column; gap: 16px; perspective: 1000px; }
        .card-3d {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-dark);
            background: linear-gradient(145deg, #ffffff, #faf4e6);
            border: 1px solid rgba(180, 134, 42, 0.25);
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 20px -5px rgba(138, 102, 28, 0.14),
                        inset 0 1px 0 rgba(255, 255, 255, 1);
        }
        .card-3d:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: #d4af37;
            box-shadow: 0 16px 28px -6px rgba(180, 134, 42, 0.28);
        }
        .card-3d:active { transform: translateY(2px) scale(0.98); }

        .icon-box {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            margin-right: 16px;
            flex-shrink: 0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15), inset 0 2px 2px rgba(255, 255, 255, 0.4);
        }
        .btn-insta .icon-box { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-google .icon-box { background: linear-gradient(135deg, #4285F4, #34A853); }
        .btn-whatsapp .icon-box { background: linear-gradient(135deg, #25D366, #128C7E); }

        .card-content { text-align: left; flex-grow: 1; }
        .card-title { font-size: 1.05rem; font-weight: 700; display: block; margin-bottom: 2px; color: var(--text-dark); }
        .card-desc { font-size: 0.78rem; color: var(--text-muted); display: block; }
        .arrow-icon { font-size: 14px; color: var(--gold-accent); transition: transform 0.25s ease; }
        .card-3d:hover .arrow-icon { transform: translateX(4px); }

        .footer {
            margin-top: 28px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nfc-dot { width: 8px; height: 8px; background-color: #d4af37; border-radius: 50%; box-shadow: 0 0 8px #d4af37; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="brand-badge" id="brand-logo"><i class="fa-solid fa-crown"></i></div>
        <h1 id="business-name">Loading...</h1>
        <p class="subtitle" id="business-tagline">Please wait a moment</p>

        <div class="links-wrapper" id="links-container">
            <a id="link-insta" href="#" target="_blank" rel="noopener noreferrer" class="card-3d btn-insta">
                <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                <div class="card-content">
                    <span class="card-title">Follow on Instagram</span>
                    <span class="card-desc">See our latest updates & reels</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a id="link-google" href="#" target="_blank" rel="noopener noreferrer" class="card-3d btn-google">
                <div class="icon-box"><i class="fa-brands fa-google"></i></div>
                <div class="card-content">
                    <span class="card-title">Rate Us on Google</span>
                    <span class="card-desc">Share your valuable feedback</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a id="link-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="card-3d btn-whatsapp">
                <div class="icon-box"><i class="fa-brands fa-whatsapp"></i></div>
                <div class="card-content">
                    <span class="card-title">Chat on WhatsApp</span>
                    <span class="card-desc">Direct message for inquiries</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            <span class="nfc-dot"></span> Smart Tap Experience
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ztfybskmgyfwjkaxqubn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A0tMvKE61iGVB7efMuzmmQ_bDU88mMe';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadStandeeData() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('id');

            if (!slug) {
                document.getElementById('business-name').textContent = 'Smart Standee Hub';
                document.getElementById('business-tagline').textContent = 'Tap an activated NFC standee or scan QR to open profile.';
                document.getElementById('links-container').classList.add('hidden');
                return;
            }

            const { data, error } = await supabaseClient
                .from('social_standees')
                .select('*')
                .eq('slug', slug)
                .single();

            if (error || !data) {
                document.getElementById('business-name').textContent = 'Standee Ready';
                document.getElementById('business-tagline').textContent = 'This standee has not been activated yet.';
                document.getElementById('links-container').classList.add('hidden');
                return;
            }

            supabaseClient
                .from('social_standees')
                .update({ clicks_count: (data.clicks_count || 0) + 1 })
                .eq('id', data.id)
                .then();

            document.title = data.business_name;
            document.getElementById('business-name').textContent = data.business_name;
            document.getElementById('business-tagline').textContent = data.tagline || 'Tap any option below to connect with us';

            if (data.logo_url) {
                document.getElementById('brand-logo').innerHTML = `<img src="${data.logo_url}" alt="${data.business_name}">`;
            }

            const instaEl = document.getElementById('link-insta');
            if (data.instagram_url) instaEl.href = data.instagram_url;
            else instaEl.classList.add('hidden');

            const googleEl = document.getElementById('link-google');
            if (data.google_review_url) googleEl.href = data.google_review_url;
            else googleEl.classList.add('hidden');

            const waEl = document.getElementById('link-whatsapp');
            if (data.whatsapp_number) {
                const cleanNum = data.whatsapp_number.replace(/\D/g, '');
                const msg = encodeURIComponent(data.whatsapp_message || 'Hello!');
                waEl.href = `https://wa.me/${cleanNum}?text=${msg}`;
            } else {
                waEl.classList.add('hidden');
            }
        }

        loadStandeeData();
    </script>
</body>
</html>
